version: 2
updates:
  # Workflow actions are pinned to major versions; this proposes new majors.
  # The Temurin JREs have their own weekly check (workflows/jre-updates.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The ubuntu:24.04 base is pinned by digest in the Dockerfile; this
  # proposes the new digest when Canonical republishes the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
