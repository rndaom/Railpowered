name: Bug report
description: The deploy, the dashboard or the Minecraft server did not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The details below make it much faster to reproduce.

        Found a security problem, such as a way into someone else's dashboard? Please don't post it here; [report it privately](https://github.com/rndaom/Railpowered/security/advisories/new) instead.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Switched the setup to Fabric 1.21.1 from the dashboard
        2. The task finished, but friends get "Connection refused"
        Expected: the server comes back online on Fabric.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did it go wrong?
      options:
        - Deploying on Railway
        - Signing in to the dashboard
        - Starting, stopping or waking the server
        - Joining from Minecraft
        - Setups, versions or modpacks
        - Worlds or backups
        - Players, whitelist or ops
        - Server settings
        - Something else
    validations:
      required: true

  - type: dropdown
    id: server-type
    attributes:
      label: Server type
      options:
        - Vanilla
        - Fabric
        - Forge
        - Modpack (.mrpack or .zip)
        - Not sure / not relevant
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: As shown in the dashboard. For a modpack, its name and where it came from.
      placeholder: "1.21.1, or latest (26.3), or a Modrinth modpack name and link"

  - type: dropdown
    id: state
    attributes:
      label: What was the server doing?
      options:
        - Sleeping
        - Preparing (installing or downloading)
        - Starting
        - Online
        - Stopped after a crash
        - Not sure
    validations:
      required: false

  - type: input
    id: railway
    attributes:
      label: Railway plan and memory
      description: Your Railway plan and the service's memory limit, plus MC_MAX_MEMORY if you changed it.
      placeholder: "Hobby, 8 GB limit, MC_MAX_MEMORY=auto"

  - type: input
    id: railpowered-version
    attributes:
      label: Railpowered version
      description: The version shown in the dashboard, or the commit your Railway service was deployed from.
      placeholder: "2.0.0"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The relevant lines from the dashboard's log view or Railway's deploy logs. They are formatted as code automatically.
        Before pasting, remove your ADMIN_KEY, any line that shows a dashboard key, and anything else you would not post publicly.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the browser you used, or whether it worked before an update.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and didn't find this one.
          required: true
        - label: I removed my ADMIN_KEY and other secrets from everything above.
          required: true
