<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMap - Beta 1.7.3</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }

    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1a1a2e; color: #eee; gap: 16px;
    }
    #loading.hidden { display: none; }
    #loading h2 { color: #4ecca3; font-size: 1.6rem; }
    #loading p { color: #8892a4; font-size: 0.95rem; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #333;
      border-top-color: #4ecca3; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay {
      position: absolute; color: #eee;
      background: rgba(26, 26, 46, 0.82);
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; pointer-events: none;
      backdrop-filter: blur(4px);
    }

    #info { top: 10px; left: 10px; }
    #info h3 { color: #4ecca3; font-size: 15px; margin-bottom: 4px; }
    #info .stat { color: #8892a4; line-height: 1.6; }

    #players-panel { top: 10px; right: 10px; min-width: 130px; }
    #players-panel h3 { color: #4ecca3; font-size: 14px; margin-bottom: 6px; }
    .player-entry { padding: 2px 0; display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .player-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ecca3; flex-shrink: 0; }
    .no-players { color: #8892a4; font-style: italic; }

    #coords {
      bottom: 10px; left: 10px;
      font-family: 'Consolas', 'Courier New', monospace; font-size: 12px;
    }

    #controls-help {
      position: absolute; bottom: 10px; right: 10px;
      color: #555; font-size: 11px; pointer-events: none;
    }

    #back-link {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      color: #4ecca3; text-decoration: none; font-size: 13px;
      pointer-events: auto; z-index: 10;
      background: rgba(26, 26, 46, 0.82); padding: 6px 14px;
      border-radius: 6px; backdrop-filter: blur(4px);
    }
    #back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>WebMap</h2>
  <p id="loading-text">Loading map data...</p>
</div>

<div id="info" class="overlay">
  <h3>WebMap</h3>
  <div class="stat" id="chunk-count">Chunks: 0</div>
  <div class="stat" id="time-status">Time: --:--</div>
  <div class="stat" id="update-status">Live updates: waiting</div>
</div>

<div id="players-panel" class="overlay">
  <h3>Players</h3>
  <div id="player-list"><span class="no-players">None online</span></div>
</div>

<div id="coords" class="overlay">Looking at: 0, 64, 0</div>

<div id="controls-help">Left-drag: rotate &middot; Right-drag: pan &middot; Scroll: zoom</div>

<a id="back-link" href="/">&larr; Admin Panel</a>

const CHUNK_RENDER_RADIUS_SQ = CHUNK_RENDER_RADIUS * CHUNK_RENDER_RADIUS;

const chunkUpdateEffects = [];
const skinTextureCache = new Map();

// -----------------------------------------------------------------------
// Three.js scene
// -----------------------------------------------------------------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

sun.position.set(200, 400, 150);

moon.position.set(-220, -260, -180);

const skyGroup = new THREE.Group();

const mapMaterial = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.FrontSide });
const nightSky = new THREE.Color(0x07111d);
const dawnSky = new THREE.Color(0x5d7db7);
const daySky = new THREE.Color(0x87ceeb);
const nightFog = new THREE.Color(0x0a1522);
const dayFog = new THREE.Color(0xaed4f0);
scene.background = daySky.clone();
scene.fog = new THREE.Fog(dayFog.clone(), 500, 2000);

const UPDATE_MAGIC = 0x574D5550;

function createPixelTexture(draw, width = 16, height = 16) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  return configureSkinTexture(new THREE.CanvasTexture(canvas));
}

function createSunTexture() {
  return createPixelTexture((ctx) => {
    ctx.clearRect(0, 0, 16, 16);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(2, 2, 12, 12);
  });
}

function createMoonTexture() {
  return createPixelTexture((ctx) => {
    ctx.clearRect(0, 0, 16, 16);
    ctx.fillStyle = '#72788d';
    ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#c8d1eb';
    ctx.fillRect(5, 0, 6, 16);
    ctx.fillRect(11, 0, 2, 16);
    ctx.fillStyle = '#a6afc9';
    ctx.fillRect(2, 0, 3, 16);
    ctx.fillRect(13, 0, 2, 16);
    ctx.fillStyle = '#7f869d';
    ctx.fillRect(0, 0, 2, 16);
    ctx.fillRect(15, 0, 1, 16);
    ctx.fillStyle = '#8d94aa';
    ctx.fillRect(6, 2, 2, 2);
    ctx.fillRect(9, 5, 2, 2);
    ctx.fillRect(7, 10, 3, 3);
  });
}

function createCelestialPlane(texture, size) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({
      map: texture,
      color: 0xffffff,
      transparent: true,
      alphaTest: 0.1,
      depthTest: true,
      depthWrite: false,
      fog: false,
      toneMapped: false
    })
  );
  return mesh;
}

function createStarField() {
  const count = 160;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 1450 + Math.random() * 300;
    const height = 400 + Math.random() * 650;
    positions[i * 3 + 0] = Math.cos(angle) * radius;
    positions[i * 3 + 1] = height;
    positions[i * 3 + 2] = Math.sin(angle) * radius;
    const tint = 0.84 + Math.random() * 0.16;
    colors[i * 3 + 0] = tint;
    colors[i * 3 + 1] = tint;
    colors[i * 3 + 2] = tint;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return new THREE.Points(geometry, new THREE.PointsMaterial({
    size: 4,
    sizeAttenuation: false,
    transparent: true,
    opacity: 0,
    vertexColors: true,
    depthWrite: false,
    depthTest: true
  }));
}

const CLOUD_PATTERNS = [
  ['0011111000','0111111110','1111111111','0111111110','0011111100'],
  ['000111110000','001111111000','011111111100','001111111000','000111110000'],
  ['001111111000','011111111110','111111111111','011111111100'],
  ['0001111000','0011111100','0111111110','0011111100','0001111000'],
  ['0011110000','0111111100','1111111110','0111111111','0011111100']
];
const cloudMaterial = new THREE.MeshBasicMaterial({
  color: 0xf6fbff,
  transparent: true,
  opacity: 0.78,
  depthTest: true,
  depthWrite: true,
  fog: false
});

function createCloudPatternMesh(pattern) {
  const group = new THREE.Group();
  const rows = pattern.length;
  const geometries = [];
  for (let z = 0; z < rows; z++) {
    const cols = pattern[z].length;
    let runStart = -1;
    for (let x = 0; x <= cols; x++) {
      const filled = x < cols && pattern[z].charAt(x) === '1';
      if (filled && runStart === -1) {
        runStart = x;
      } else if (!filled && runStart !== -1) {
        const runLength = x - runStart;
        const geometry = new THREE.BoxGeometry(runLength * 8, 2.5, 8);
        const centerX = runStart + runLength * 0.5;
        geometry.translate((centerX - cols * 0.5) * 8, 0, (z - rows * 0.5) * 8);
        geometries.push(geometry);
        runStart = -1;
      }
    }
  }

  if (geometries.length > 0) {
    const merged = mergeGeometries(geometries, false);
    geometries.forEach((geometry) => geometry.dispose());
    const mesh = new THREE.Mesh(merged, cloudMaterial.clone());
    mesh.renderOrder = 1;
    group.add(mesh);
  }

  return group;
}

function createCloudLayer() {
  const layer = new THREE.Group();
  const placements = [
    [-340, -260, 0.9, 0], [-220, -120, 0.72, 1], [-80, -320, 0.64, 2],
    [40, -180, 0.8, 3], [170, -290, 0.58, 4], [320, -110, 0.76, 0],
    [-300, 60, 0.66, 1], [-140, 180, 0.82, 2], [10, 100, 0.6, 3],
    [180, 220, 0.7, 4], [340, 80, 0.55, 0], [-30, 300, 0.74, 1]
  ];
  for (const [x, z, speed, patternIndex] of placements) {
    const cloud = createCloudPatternMesh(CLOUD_PATTERNS[patternIndex]);
    cloud.position.set(x, 148, z);
    cloud.userData.baseX = x;
    cloud.userData.baseZ = z;
    cloud.userData.speed = speed;
    layer.add(cloud);
  }
  return layer;
}

// -----------------------------------------------------------------------
// Data loading - binary format
// -----------------------------------------------------------------------
const MAGIC = 0x574D4150;

function readChunkRecord(view, buffer, offset, version) {
  const cx = view.getInt32(offset); offset += 4;
  const cz = view.getInt32(offset); offset += 4;
  const h = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
  const b = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
  const base = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;

  let mh = new Uint8Array(256);
  let mb = new Uint8Array(256);
  let mbase = new Uint8Array(256);
  let gh = new Uint8Array(256);
  let gb = new Uint8Array(256);
  let gbase = new Uint8Array(256);

  if (version >= 6) {
    mh = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    mb = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    mbase = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    gh = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    gb = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    gbase = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
  } else if (version >= 4) {
    mh = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    mb = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
    mbase = new Uint8Array(buffer.slice(offset, offset + 256)); offset += 256;
  }

  return [{ h, b, base, mh, mb, mbase, gh, gb, gbase, cx, cz }, offset];
}

async function loadMapData() {
  try {
    const resp = await fetch('/map/data/mapdata.bin', { cache: 'no-store' });
    if (!resp.ok) {
      loadingTextEl.textContent = 'Waiting for map data - server needs to generate it...';
      setTimeout(loadMapData, 5000);
      return;
    }

    const buffer = await resp.arrayBuffer();
    if (buffer.byteLength < 24) {
      loadingTextEl.textContent = 'Map data too small - retrying...';
      setTimeout(loadMapData, 5000);
      return;
    }

    const view = new DataView(buffer);
    let offset = 0;

    const magic = view.getInt32(offset); offset += 4;
    if (magic !== MAGIC) {
      loadingTextEl.textContent = 'Invalid map data format.';
      return;
    }

    const dataVersion = view.getInt32(offset); offset += 4;
    spawnPoint.x = view.getInt32(offset); offset += 4;
    spawnPoint.y = view.getInt32(offset); offset += 4;
    spawnPoint.z = view.getInt32(offset); offset += 4;
    const chunkCount = view.getInt32(offset); offset += 4;

    if (chunkCount === 0) {
      loadingTextEl.textContent = 'Map is empty - waiting for chunks to load...';
      setTimeout(loadMapData, 5000);
      return;
    }

    loadingTextEl.textContent = `Building terrain (${chunkCount} chunks)...`;
    await new Promise(resolve => setTimeout(resolve, 50));

    const newChunks = {};
    for (let i = 0; i < chunkCount; i++) {
      const [chunk, nextOffset] = readChunkRecord(view, buffer, offset, dataVersion);
      offset = nextOffset;
      newChunks[chunk.cx + ',' + chunk.cz] = chunk;
    }

    chunks = newChunks;
    buildTerrain();
    chunkCountEl.textContent = 'Chunks: ' + chunkCount;
    updateStatusEl.textContent = 'Live updates: connected';
  } catch (e) {
    loadingTextEl.textContent = 'Error loading map: ' + e.message;
    setTimeout(loadMapData, 5000);
  }
}

// -----------------------------------------------------------------------
// Terrain mesh building
// -----------------------------------------------------------------------
function getRegionCoord(chunkCoord) {
  return Math.floor(chunkCoord / REGION_SIZE_CHUNKS);
}

function getRegionKey(rx, rz) {
  return rx + ',' + rz;
}

function getRegionKeyForChunk(cx, cz) {
  return getRegionKey(getRegionCoord(cx), getRegionCoord(cz));
}

function clearRegionBuildQueue() {
  regionBuildQueue.length = 0;
  queuedRegionKeys.clear();
  initialBuildPending = false;
  queuedRegionTotal = 0;
  builtRegionCount = 0;
}

function disposeRegionMesh(key) {
  const mesh = regionMeshes[key];
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  delete regionMeshes[key];
}

function disposeAllRegionMeshes() {
  for (const key in regionMeshes) {
    disposeRegionMesh(key);
  }
  regionMeshes = {};
}

function queueRegionBuild(rx, rz) {
  const key = getRegionKey(rx, rz);
  if (queuedRegionKeys.has(key)) return;
  queuedRegionKeys.add(key);
  regionBuildQueue.push({ key, rx, rz });
}

function queueAllRegionBuilds(showLoading) {
  const seen = new Set();
  const queued = [];
  const targetChunkX = Math.floor(controls.target.x / 16);
  const targetChunkZ = Math.floor(controls.target.z / 16);

  for (const chunk of Object.values(chunks)) {
    const rx = getRegionCoord(chunk.cx);
    const rz = getRegionCoord(chunk.cz);
    const key = getRegionKey(rx, rz);
    if (seen.has(key)) continue;
    seen.add(key);
    queued.push({ key, rx, rz });
  }

  queued.sort((a, b) => {
    const adx = a.rx * REGION_SIZE_CHUNKS + REGION_SIZE_CHUNKS * 0.5 - targetChunkX;
    const adz = a.rz * REGION_SIZE_CHUNKS + REGION_SIZE_CHUNKS * 0.5 - targetChunkZ;
    const bdx = b.rx * REGION_SIZE_CHUNKS + REGION_SIZE_CHUNKS * 0.5 - targetChunkX;
    const bdz = b.rz * REGION_SIZE_CHUNKS + REGION_SIZE_CHUNKS * 0.5 - targetChunkZ;
    return (adx * adx + adz * adz) - (bdx * bdx + bdz * bdz);
  });

  queuedRegionTotal = queued.length;
  builtRegionCount = 0;
  initialBuildPending = showLoading && queued.length > 0;

  if (initialBuildPending) {
    loadingTextEl.textContent = `Building terrain (0/${queuedRegionTotal} regions)...`;
    loadingEl.classList.remove('hidden');
  } else if (showLoading) {
    loadingEl.classList.add('hidden');
  }

  for (const region of queued) {
    queueRegionBuild(region.rx, region.rz);
  }
}

function markDirtyRegionsForChunk(dirtyRegions, cx, cz) {
  for (const [dx, dz] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
    dirtyRegions.add(getRegionKeyForChunk(cx + dx, cz + dz));
  }
}

function buildTerrain() {
  if (initialLoad) {
    initialLoad = false;
    camera.position.set(spawnPoint.x + 120, 180, spawnPoint.z + 120);
    controls.target.set(spawnPoint.x, spawnPoint.y, spawnPoint.z);
    controls.update();
  }

  disposeAllRegionMeshes();
  clearRegionBuildQueue();
  queueAllRegionBuilds(true);
  updateRegionVisibility(true);
}

function getChunkAtLocal(lx, lz, chunk) {
  let src = chunk;
  if (lx < 0 || lx >= 16 || lz < 0 || lz >= 16) {
    let ncx = chunk.cx;
    let ncz = chunk.cz;
    if (lx < 0) { ncx--; lx += 16; }
    else if (lx >= 16) { ncx++; lx -= 16; }
    if (lz < 0) { ncz--; lz += 16; }
    else if (lz >= 16) { ncz++; lz -= 16; }
    src = chunks[ncx + ',' + ncz] || null;
  }
  return { chunk: src, idx: lx * 16 + lz };
}

function getColumnSegments(chunk, idx) {
  if (!chunk || idx < 0 || idx >= 256) return [];
  const segments = [];
  if (chunk.b[idx] > 0) segments.push({ top: chunk.h[idx] + 1, base: chunk.base[idx], blockId: chunk.b[idx] });
  if (chunk.mb[idx] > 0) segments.push({ top: chunk.mh[idx] + 1, base: chunk.mbase[idx], blockId: chunk.mb[idx] });
  if (chunk.gb[idx] > 0) segments.push({ top: chunk.gh[idx] + 1, base: chunk.gbase[idx], blockId: chunk.gb[idx] });
  return segments;
}

function subtractCoveredRanges(base, top, covered) {
  if (covered.length === 0) return [[base, top]];
  const ranges = covered
    .map(([s, e]) => [Math.max(base, s), Math.min(top, e)])
    .filter(([s, e]) => s < e)
    .sort((a, b) => a[0] - b[0]);

  const visible = [];
  let cursor = base;
  for (const [start, end] of ranges) {
    if (start > cursor) visible.push([cursor, start]);
    if (end > cursor) cursor = end;
    if (cursor >= top) break;
  }
  if (cursor < top) visible.push([cursor, top]);
  return visible;
}

function pushQuad(positions, colors,
                  x0, y0, z0, x1, y1, z1, x2, y2, z2, x3, y3, z3, c) {
  positions.push(x0, y0, z0, x1, y1, z1, x2, y2, z2);
  positions.push(x0, y0, z0, x2, y2, z2, x3, y3, z3);
  for (let i = 0; i < 6; i++) colors.push(c[0], c[1], c[2]);
}

function pushSegmentSide(pos, col, dir, wx, wz, y0, y1, color) {
  if (dir === 0) pushQuad(pos, col,
    wx + 1, y0, wz, wx + 1, y1, wz, wx + 1, y1, wz + 1, wx + 1, y0, wz + 1, color);
  else if (dir === 1) pushQuad(pos, col,
    wx, y0, wz + 1, wx, y1, wz + 1, wx, y1, wz, wx, y0, wz, color);
  else if (dir === 2) pushQuad(pos, col,
    wx + 1, y0, wz + 1, wx + 1, y1, wz + 1, wx, y1, wz + 1, wx, y0, wz + 1, color);
  else pushQuad(pos, col,
    wx, y0, wz, wx, y1, wz, wx + 1, y1, wz, wx + 1, y0, wz, color);
}

function appendChunkGeometry(pos, col, chunk) {
  const cx = chunk.cx;
  const cz = chunk.cz;

  for (let x = 0; x < 16; x++) {
    for (let z = 0; z < 16; z++) {
      const idx = x * 16 + z;
      const wx = cx * 16 + x;
      const wz = cz * 16 + z;
      const segments = getColumnSegments(chunk, idx);
      if (segments.length === 0) continue;

      for (const seg of segments) {
        const topColor = getColor(seg.blockId);
        const sideColor = seg.blockId === 2 ? getColor(3) : topColor;
        const visibleBase = seg.base;
        const eastNeighbor = getChunkAtLocal(x + 1, z, chunk);
        const westNeighbor = getChunkAtLocal(x - 1, z, chunk);
        const southNeighbor = getChunkAtLocal(x, z + 1, chunk);
        const northNeighbor = getChunkAtLocal(x, z - 1, chunk);

        pushQuad(pos, col,
          wx, seg.top, wz, wx, seg.top, wz + 1,
          wx + 1, seg.top, wz + 1, wx + 1, seg.top, wz,
          topColor);

        if (visibleBase < seg.top) {
          pushQuad(pos, col,
            wx, visibleBase, wz + 1, wx, visibleBase, wz,
            wx + 1, visibleBase, wz, wx + 1, visibleBase, wz + 1,
            topColor);
        }

        const neighborSets = [
          getColumnSegments(eastNeighbor.chunk, eastNeighbor.idx),
          getColumnSegments(westNeighbor.chunk, westNeighbor.idx),
          getColumnSegments(southNeighbor.chunk, southNeighbor.idx),
          getColumnSegments(northNeighbor.chunk, northNeighbor.idx)
        ];

        for (let d = 0; d < 4; d++) {
          const covered = neighborSets[d].map(neighbor => [neighbor.base, neighbor.top]);
          const visible = subtractCoveredRanges(visibleBase, seg.top, covered);
          for (const [y0, y1] of visible) {
            if (y0 >= y1) continue;
            pushSegmentSide(pos, col, d, wx, wz, y0, y1, sideColor);
          }
        }
      }
    }
  }
}

function buildRegionMesh(rx, rz) {
  const pos = [];
  const col = [];
  const startChunkX = rx * REGION_SIZE_CHUNKS;
  const startChunkZ = rz * REGION_SIZE_CHUNKS;

  for (let x = 0; x < REGION_SIZE_CHUNKS; x++) {
    for (let z = 0; z < REGION_SIZE_CHUNKS; z++) {
      const chunk = chunks[(startChunkX + x) + ',' + (startChunkZ + z)];
      if (chunk) appendChunkGeometry(pos, col, chunk);
    }
  }

  if (pos.length === 0) return null;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, mapMaterial);
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  mesh.userData = { rx, rz };
  mesh.visible = isRegionVisible(rx, rz, controls.target.x, controls.target.z);
  return mesh;
}

function rebuildRegionMesh(rx, rz) {
  const key = getRegionKey(rx, rz);
  disposeRegionMesh(key);
  const mesh = buildRegionMesh(rx, rz);
  if (!mesh) return;
  scene.add(mesh);
  regionMeshes[key] = mesh;
}

function regionDistanceSq(rx, rz, tx, tz) {
  const minX = rx * REGION_SIZE_BLOCKS;
  const minZ = rz * REGION_SIZE_BLOCKS;
  const maxX = minX + REGION_SIZE_BLOCKS;
  const maxZ = minZ + REGION_SIZE_BLOCKS;
  const dx = tx < minX ? minX - tx : (tx > maxX ? tx - maxX : 0);
  const dz = tz < minZ ? minZ - tz : (tz > maxZ ? tz - maxZ : 0);
  return dx * dx + dz * dz;
}

function isRegionVisible(rx, rz, tx, tz) {
  return regionDistanceSq(rx, rz, tx, tz) <= CHUNK_RENDER_RADIUS_SQ;
}

function updateRegionVisibility(force) {
  const targetChunkX = Math.floor(controls.target.x / 16);
  const targetChunkZ = Math.floor(controls.target.z / 16);
  if (!force && targetChunkX === lastVisibleTargetChunkX && targetChunkZ === lastVisibleTargetChunkZ) {
    return;
  }

  lastVisibleTargetChunkX = targetChunkX;
  lastVisibleTargetChunkZ = targetChunkZ;

  const tx = controls.target.x;
  const tz = controls.target.z;
  for (const mesh of Object.values(regionMeshes)) {
    mesh.visible = isRegionVisible(mesh.userData.rx, mesh.userData.rz, tx, tz);
  }
}

function processRegionBuildQueue() {
  if (regionBuildQueue.length === 0) return;

  const budgetMs = initialBuildPending ? 12 : 6;
  const start = performance.now();
  let rebuilt = false;

  while (regionBuildQueue.length > 0 && (performance.now() - start) < budgetMs) {
    const region = regionBuildQueue.shift();
    queuedRegionKeys.delete(region.key);
    rebuildRegionMesh(region.rx, region.rz);
    rebuilt = true;

    if (initialBuildPending) {
      builtRegionCount++;
      loadingTextEl.textContent = `Building terrain (${builtRegionCount}/${queuedRegionTotal} regions)...`;
    }
  }

  if (rebuilt) {
    updateRegionVisibility(true);
  }

  if (initialBuildPending && regionBuildQueue.length === 0) {
    initialBuildPending = false;
    loadingEl.classList.add('hidden');
  }
}

function chunkArrayEquals(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
}

function chunkEquals(a, b) {
  return a.cx === b.cx
    && a.cz === b.cz
    && chunkArrayEquals(a.h, b.h)
    && chunkArrayEquals(a.b, b.b)
    && chunkArrayEquals(a.base, b.base)
    && chunkArrayEquals(a.mh, b.mh)
    && chunkArrayEquals(a.mb, b.mb)
    && chunkArrayEquals(a.mbase, b.mbase)
    && chunkArrayEquals(a.gh, b.gh)
    && chunkArrayEquals(a.gb, b.gb)
    && chunkArrayEquals(a.gbase, b.gbase);
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin('anonymous');

function configureSkinTexture(texture) {
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
}

function createDefaultSkinTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#7d4e36';
  ctx.fillRect(8, 0, 8, 8);
  ctx.fillRect(16, 0, 8, 8);
  ctx.fillRect(0, 8, 8, 8);
  ctx.fillRect(16, 8, 8, 8);
  ctx.fillRect(24, 8, 8, 8);
  ctx.fillRect(8, 8, 8, 8);
  ctx.fillStyle = '#3f2a1f';
  ctx.fillRect(8, 0, 8, 3);
  ctx.fillRect(8, 8, 8, 2);
  ctx.fillStyle = '#e0b38d';
  ctx.fillRect(10, 10, 4, 4);
  ctx.fillRect(20, 16, 8, 4);
  ctx.fillRect(44, 20, 4, 4);
  ctx.fillRect(4, 20, 4, 4);
  ctx.fillStyle = '#4d9acb';
  ctx.fillRect(20, 20, 8, 8);
  ctx.fillRect(44, 24, 4, 8);
  ctx.fillRect(4, 24, 4, 8);
  ctx.fillStyle = '#24384f';
  ctx.fillRect(4, 28, 12, 4);

  return configureSkinTexture(new THREE.CanvasTexture(canvas));
}

const defaultSkinTexture = createDefaultSkinTexture();
const CLASSIC_SKIN_LAYOUT = {
  head: { right: [0, 8, 8, 8], left: [16, 8, 8, 8], top: [8, 0, 8, 8], bottom: [16, 0, 8, 8], front: [8, 8, 8, 8], back: [24, 8, 8, 8] },
  hat: { right: [32, 8, 8, 8], left: [48, 8, 8, 8], top: [40, 0, 8, 8], bottom: [48, 0, 8, 8], front: [40, 8, 8, 8], back: [56, 8, 8, 8] },
  body: { right: [16, 20, 4, 12], left: [28, 20, 4, 12], top: [20, 16, 8, 4], bottom: [28, 16, 8, 4], front: [20, 20, 8, 12], back: [32, 20, 8, 12] },
  arm: { right: [40, 20, 4, 12], left: [48, 20, 4, 12], top: [44, 16, 4, 4], bottom: [48, 16, 4, 4], front: [44, 20, 4, 12], back: [52, 20, 4, 12] },
  leg: { right: [0, 20, 4, 12], left: [8, 20, 4, 12], top: [4, 16, 4, 4], bottom: [8, 16, 4, 4], front: [4, 20, 4, 12], back: [12, 20, 4, 12] }
};

function getSkinCacheKey(player) {
  return player.skinUrl || player.uuid || player.name;
}

function ensureSkinTexture(player) {
  const key = getSkinCacheKey(player);
  let entry = skinTextureCache.get(key);
  if (!entry) {
    entry = { texture: defaultSkinTexture, loading: false, error: false };
    skinTextureCache.set(key, entry);
  }

  if (!player.skinUrl || entry.loading || entry.error || entry.texture !== defaultSkinTexture) {
    return entry.texture;
  }

  entry.loading = true;
  textureLoader.load(player.skinUrl, (texture) => {
    entry.texture = configureSkinTexture(texture);
    entry.loading = false;
  }, undefined, () => {
    entry.loading = false;
    entry.error = true;
  });

  return entry.texture;
}

function setFaceUVs(geometry, faceIndex, rect, texWidth, texHeight) {
  const [x, y, w, h] = rect;
  const u0 = x / texWidth;
  const u1 = (x + w) / texWidth;
  const v0 = 1 - (y + h) / texHeight;
  const v1 = 1 - y / texHeight;
  const uv = geometry.getAttribute('uv');
  const base = faceIndex * 4;
  uv.setXY(base + 0, u0, v1);
  uv.setXY(base + 1, u1, v1);
  uv.setXY(base + 2, u0, v0);
  uv.setXY(base + 3, u1, v0);
  uv.needsUpdate = true;
}

function applyBoxLayout(geometry, layout, texWidth, texHeight) {
  setFaceUVs(geometry, 0, layout.right, texWidth, texHeight);
  setFaceUVs(geometry, 1, layout.left, texWidth, texHeight);
  setFaceUVs(geometry, 2, layout.top, texWidth, texHeight);
  setFaceUVs(geometry, 3, layout.bottom, texWidth, texHeight);
  setFaceUVs(geometry, 4, layout.front, texWidth, texHeight);
  setFaceUVs(geometry, 5, layout.back, texWidth, texHeight);
}

function createSkinMaterial(texture, transparent = false) {
  return new THREE.MeshLambertMaterial({
    map: texture,
    transparent,
    alphaTest: transparent ? 0.05 : 0,
    depthWrite: !transparent
  });
}

function createSkinnedBox(size, layout, texture, transparent = false) {
  const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
  const texWidth = texture.image?.width || 64;
  const texHeight = texture.image?.height || 64;
  applyBoxLayout(geometry, layout, texWidth, texHeight);
  return new THREE.Mesh(geometry, createSkinMaterial(texture, transparent));
}

function createPivot(x, y, z) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, z);
  return pivot;
}

function createNameLabel(name) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeText(name, 128, 32);
  ctx.fillStyle = '#fff';
  ctx.fillText(name, 128, 32);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const label = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false })
  );
  label.scale.set(5.5, 1.35, 1);
  label.position.y = 2.6;
  return label;
}

function disposeObject3D(object) {
  object.traverse((child) => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) child.material.forEach((material) => material.dispose());
      else child.material.dispose();
    }
  });
}

function rebuildPlayerAvatar(marker, texture, skinKey) {
  const avatar = marker.userData.avatar;
  while (avatar.children.length > 0) {
    const child = avatar.children.pop();
    disposeObject3D(child);
  }

  const torso = createPivot(0, 0.75, 0);
  avatar.add(torso);

  const body = createSkinnedBox(new THREE.Vector3(0.5, 0.75, 0.25), CLASSIC_SKIN_LAYOUT.body, texture);
  body.position.y = 0.375;
  torso.add(body);

  const headPivot = createPivot(0, 0.75, 0);
  torso.add(headPivot);
  const head = createSkinnedBox(new THREE.Vector3(0.5, 0.5, 0.5), CLASSIC_SKIN_LAYOUT.head, texture);
  head.position.y = 0.25;
  headPivot.add(head);

  const hat = createSkinnedBox(new THREE.Vector3(0.53, 0.53, 0.53), CLASSIC_SKIN_LAYOUT.hat, texture, true);
  hat.position.y = 0.25;
  headPivot.add(hat);

  const rightArmPivot = createPivot(-0.375, 0.75, 0);
  torso.add(rightArmPivot);
  const rightArm = createSkinnedBox(new THREE.Vector3(0.25, 0.75, 0.25), CLASSIC_SKIN_LAYOUT.arm, texture);
  rightArm.position.y = -0.375;
  rightArmPivot.add(rightArm);

  const leftArmPivot = createPivot(0.375, 0.75, 0);
  torso.add(leftArmPivot);
  const leftArm = createSkinnedBox(new THREE.Vector3(0.25, 0.75, 0.25), CLASSIC_SKIN_LAYOUT.arm, texture);
  leftArm.position.y = -0.375;
  leftArmPivot.add(leftArm);

  const rightLegPivot = createPivot(-0.125, 0.75, 0);
  avatar.add(rightLegPivot);
  const rightLeg = createSkinnedBox(new THREE.Vector3(0.25, 0.75, 0.25), CLASSIC_SKIN_LAYOUT.leg, texture);
  rightLeg.position.y = -0.375;
  rightLegPivot.add(rightLeg);

  const leftLegPivot = createPivot(0.125, 0.75, 0);
  avatar.add(leftLegPivot);
  const leftLeg = createSkinnedBox(new THREE.Vector3(0.25, 0.75, 0.25), CLASSIC_SKIN_LAYOUT.leg, texture);
  leftLeg.position.y = -0.375;
  leftLegPivot.add(leftLeg);

  marker.userData.parts = {
    torso,
    body,
    headPivot,
    head,
    hat,
    rightArmPivot,
    leftArmPivot,
    rightArm,
    leftArm,
    rightLegPivot,
    leftLegPivot,
    rightLeg,
    leftLeg
  };
  marker.userData.skinKey = skinKey;
  marker.userData.skinTexture = texture;
}

async function loadPlayers() {
  if (playerPollInFlight) return;
  playerPollInFlight = true;
  try {
    const resp = await fetch('/map/data/players.json', { cache: 'no-store' });
    if (!resp.ok) return;
    const players = await resp.json();

    if (players.length === 0) {
      playerListEl.innerHTML = '<span class="no-players">None online</span>';
    } else {
      playerListEl.innerHTML = players.map(player => {
        const xyz = `${Math.round(player.x)}, ${Math.round(player.y)}, ${Math.round(player.z)}`;
        return '<div class="player-entry"><span class="player-dot"></span><div><div>' +
          escHtml(player.name) + '</div><div style="color:#8892a4;font-size:11px;">' + xyz + '</div></div></div>';
      }).join('');
    }

    for (const name in playerMarkers) {
      if (!players.some(player => player.name === name)) {
        const marker = playerMarkers[name];
        scene.remove(marker);
        disposeObject3D(marker);
        delete playerMarkers[name];
      }
    }

    for (const player of players) {
      if (!playerMarkers[player.name]) {
        playerMarkers[player.name] = createPlayerMarker(player);
        scene.add(playerMarkers[player.name]);
      } else {
        syncPlayerMarker(playerMarkers[player.name], player);
      }
    }
  } catch (e) {
    // Ignore player refresh failures.
  } finally {
    playerPollInFlight = false;
  }
}

function createPlayerMarker(player) {
  const group = new THREE.Group();
  const avatar = new THREE.Group();
  group.add(avatar);

  const label = createNameLabel(player.name);
  group.add(label);

  group.userData.avatar = avatar;
  group.userData.label = label;
  group.userData.targetPosition = new THREE.Vector3(player.x, player.y, player.z);
  group.userData.targetYaw = 0;
  group.userData.skinKey = null;
  group.userData.skinTexture = null;
  group.userData.walkCycle = 0;
  group.userData.motion = 0;
  group.userData.lastNetworkStep = 0;
  group.userData.lastTargetUpdate = performance.now();
  group.userData.pose = { sneaking: false, sleeping: false, mounted: false, sitting: false, vehicleType: '' };

  group.position.copy(group.userData.targetPosition);
  syncPlayerMarker(group, player, true);
  return group;
}

function syncPlayerMarker(marker, player, snapPosition = false) {
  const previousTarget = marker.userData.targetPosition.clone();
  const skinKey = getSkinCacheKey(player);
  const texture = ensureSkinTexture(player);
  if (marker.userData.skinKey !== skinKey || marker.userData.skinTexture !== texture) {
    rebuildPlayerAvatar(marker, texture, skinKey);
  }

  marker.userData.targetPosition.set(player.x, player.y, player.z);
  marker.userData.lastNetworkStep = previousTarget.distanceTo(marker.userData.targetPosition);
  marker.userData.lastTargetUpdate = performance.now();
  marker.userData.targetYaw = THREE.MathUtils.degToRad(-(player.yaw || 0));
  marker.userData.pose = {
    sneaking: !!player.sneaking,
    sleeping: !!player.sleeping,
    mounted: !!player.mounted,
    sitting: !!player.sitting,
    vehicleType: player.vehicleType || ''
  };
  if (snapPosition) {
    marker.position.copy(marker.userData.targetPosition);
  }
}

function escHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

async function refreshMapData() {
  try {
    const resp = await fetch('/map/data/mapdata.bin', { cache: 'no-store' });
    if (!resp.ok) return;

    const buffer = await resp.arrayBuffer();
    if (buffer.byteLength < 24) return;

    const view = new DataView(buffer);
    if (view.getInt32(0) !== MAGIC) return;

    let offset = 4;
    const version = view.getInt32(offset); offset += 4;
    offset += 12;
    const chunkCount = view.getInt32(offset); offset += 4;

    const newChunks = {};
    for (let i = 0; i < chunkCount; i++) {
      const [chunk, nextOffset] = readChunkRecord(view, buffer, offset, version);
      offset = nextOffset;
      newChunks[chunk.cx + ',' + chunk.cz] = chunk;
    }

    const newKeys = Object.keys(newChunks);
    const oldKeys = Object.keys(chunks);
    const dirtyRegions = new Set();

    for (const key of oldKeys) {
      if (!newChunks[key]) {
        const oldChunk = chunks[key];
        markDirtyRegionsForChunk(dirtyRegions, oldChunk.cx, oldChunk.cz);
        delete chunks[key];
      }
    }

    for (const key of newKeys) {
      if (!chunks[key] || !chunkEquals(chunks[key], newChunks[key])) {
        chunks[key] = newChunks[key];
        markDirtyRegionsForChunk(dirtyRegions, newChunks[key].cx, newChunks[key].cz);
      }
    }

    for (const key of dirtyRegions) {
      const parts = key.split(',');
      queueRegionBuild(parseInt(parts[0], 10), parseInt(parts[1], 10));
    }

    chunkCountEl.textContent = 'Chunks: ' + newKeys.length;
  } catch (e) {
    // Ignore map refresh failures.
  }
}

async function loadChunkUpdates() {
  if (chunkUpdatePollInFlight) return;
  chunkUpdatePollInFlight = true;
  try {
    const resp = await fetch('/map/data/chunk-updates.bin', { cache: 'no-store' });
    if (resp.status === 404 || !resp.ok) return;

    const buffer = await resp.arrayBuffer();
    if (buffer.byteLength < 16) return;

    const view = new DataView(buffer);
    let offset = 0;
    if (view.getInt32(offset) !== UPDATE_MAGIC) return;
    offset += 4;

    const version = view.getInt32(offset); offset += 4;
    if (version < 1) return;

    const revision = view.getInt32(offset); offset += 4;
    const chunkCount = view.getInt32(offset); offset += 4;
    if (revision === lastChunkUpdateRevision) return;

    const dirtyRegions = new Set();
    for (let i = 0; i < chunkCount; i++) {
      const [chunk, nextOffset] = readChunkRecord(view, buffer, offset, 6);
      offset = nextOffset;
      const key = chunk.cx + ',' + chunk.cz;
      if (!chunks[key] || !chunkEquals(chunks[key], chunk)) {
        chunks[key] = chunk;
        markDirtyRegionsForChunk(dirtyRegions, chunk.cx, chunk.cz);
        flashChunkUpdate(chunk.cx, chunk.cz, chunk);
      }
    }

    for (const key of dirtyRegions) {
      const parts = key.split(',');
      queueRegionBuild(parseInt(parts[0], 10), parseInt(parts[1], 10));
    }

    lastChunkUpdateRevision = revision;
    updateStatusEl.textContent = 'Live updates: revision ' + revision;
  } catch (e) {
    updateStatusEl.textContent = 'Live updates: reconnecting';
  } finally {
    chunkUpdatePollInFlight = false;
  }
}

async function loadWorldState() {
  if (worldPollInFlight) return;
  worldPollInFlight = true;
  try {
    const resp = await fetch('/map/data/world.json', { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    worldState.time = Number.isFinite(data.time) ? data.time : worldState.time;
    worldState.storm = !!data.storm;
    worldState.receivedAtMs = performance.now();
    worldState.loaded = true;
  } catch (e) {
    // Ignore world refresh failures.
  } finally {
    worldPollInFlight = false;
  }
}

function updateChunkEffects(now) {

function getInterpolatedWorldTime(now) {
  if (!worldState.loaded) return 6000;
  return (worldState.time + Math.max(0, (now - worldState.receivedAtMs) / 1000) * 20) % 24000;
}

function formatMinecraftTime(worldTime) {
  const totalHours = ((worldTime / 1000) + 6) % 24;
  const hours = Math.floor(totalHours);
  const minutes = Math.floor((totalHours - hours) * 60);
  return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
}

function updateSkyObjects(now, worldTime, lightMix) {
  skyGroup.position.set(camera.position.x, 0, camera.position.z);

  const cloudDrift = now * 0.01;
  const cloudAnchorX = Math.floor(camera.position.x / 512) * 512;
  const cloudAnchorZ = Math.floor(camera.position.z / 512) * 512;
  cloudLayer.position.set(cloudAnchorX, 0, cloudAnchorZ);
  for (const cloud of cloudLayer.children) {
    const scroll = cloud.userData.speed || 1;
    const wrapped = ((((cloud.userData.baseX + cloudDrift * scroll) + 512) % 1024) + 1024) % 1024 - 512;
    cloud.position.x = wrapped;
    cloud.position.z = cloud.userData.baseZ;
  }

  const phase = (worldTime / 24000) * Math.PI * 2;
  const orbitRadius = 1650;
  const orbitHeight = 700;
  const sunX = Math.cos(phase) * orbitRadius;
  const sunY = 220 + Math.sin(phase) * orbitHeight;
  const moonX = Math.cos(phase + Math.PI) * orbitRadius;
  const moonY = 220 + Math.sin(phase + Math.PI) * orbitHeight;

  sunSprite.position.set(sunX, sunY, -420);
  moonSprite.position.set(moonX, moonY, 420);
  sunSprite.lookAt(camera.position);
  moonSprite.lookAt(camera.position);
  sunSprite.material.opacity = THREE.MathUtils.clamp(0.18 + lightMix * 1.05, 0, 1);
  moonSprite.material.opacity = THREE.MathUtils.clamp(0.08 + (1 - lightMix) * 0.92, 0, 1);

  const starAlpha = THREE.MathUtils.clamp((1 - lightMix) * 1.25, 0, 1);
  stars.material.opacity = starAlpha * 0.9;
  stars.visible = starAlpha > 0.01;
  stars.rotation.y = now * 0.00002;

  for (const cloud of cloudLayer.children) {
    for (const voxel of cloud.children) {
      voxel.material.opacity = (worldState.storm ? 0.84 : 0.78) * (0.74 + lightMix * 0.26);
    }
  }
}

function updateDayNight(now) {
  const worldTime = getInterpolatedWorldTime(now);
  const phase = (worldTime / 24000) * Math.PI * 2;
  const sunHeight = Math.sin(phase);
  const daylight = THREE.MathUtils.clamp((sunHeight + 0.18) / 1.18, 0, 1);
  const stormDarken = worldState.storm ? 0.18 : 0;
  const lightMix = Math.max(0.08, daylight - stormDarken);
  const dawnBlend = 1 - Math.abs(daylight * 2 - 1);

  const sky = new THREE.Color();
  sky.lerpColors(nightSky, daySky, lightMix);
  sky.lerp(dawnSky, dawnBlend * 0.26);
  if (worldState.storm) sky.multiplyScalar(0.76);

  const fogColor = new THREE.Color();
  fogColor.lerpColors(nightFog, dayFog, lightMix);
  if (worldState.storm) fogColor.multiplyScalar(0.72);

  scene.background.copy(sky);
  scene.fog.color.copy(fogColor);
  ambientLight.intensity = 0.18 + lightMix * 0.55;
  skyFillLight.intensity = 0.25 + lightMix * 0.6;
  sun.intensity = 0.08 + lightMix * 1.05;
  moon.intensity = 0.03 + (1 - lightMix) * 0.18;

  const sunX = Math.cos(phase) * 380;
  const sunY = sunHeight * 420;
  sun.position.set(sunX, sunY, 200);
  moon.position.set(-sunX, -sunY, -160);
  updateSkyObjects(now, worldTime, lightMix);

  const phaseLabel = worldTime >= 13000 || worldTime < 1000
    ? 'Sunrise'
    : worldTime < 12000
      ? 'Day'
      : worldTime < 14000
        ? 'Sunset'
        : 'Night';
  timeStatusEl.textContent = 'Time: ' + formatMinecraftTime(worldTime) +
    ' | ' + phaseLabel + (worldState.storm ? ' | Storm' : '');
}

function shortestAngleDelta(from, to) {
  let delta = to - from;
  while (delta > Math.PI) delta -= Math.PI * 2;
  while (delta < -Math.PI) delta += Math.PI * 2;
  return delta;
}

function updatePlayersVisuals(deltaSeconds) {
  for (const marker of Object.values(playerMarkers)) {
    const beforeX = marker.position.x;
    const beforeZ = marker.position.z;
    const distance = marker.position.distanceTo(marker.userData.targetPosition);
    const chaseFactor = THREE.MathUtils.clamp(0.18 + distance * 0.04, 0.18, 0.6);
    marker.position.lerp(marker.userData.targetPosition, chaseFactor);
    const pose = marker.userData.pose || {};
    marker.userData.avatar.rotation.y += shortestAngleDelta(
      marker.userData.avatar.rotation.y,
      marker.userData.targetYaw
    ) * 0.22;
    marker.userData.label.quaternion.copy(camera.quaternion);

    const movedXZ = Math.hypot(marker.position.x - beforeX, marker.position.z - beforeZ);
    const targetMotion = THREE.MathUtils.clamp((movedXZ * 14) + marker.userData.lastNetworkStep * 0.45, 0, 1);
    marker.userData.motion += (targetMotion - marker.userData.motion) * 0.18;
    marker.userData.walkCycle += (2.6 + marker.userData.motion * 8.5) * deltaSeconds;

    const swing = Math.sin(marker.userData.walkCycle) * 0.52 * marker.userData.motion;
    const headBob = Math.abs(Math.sin(marker.userData.walkCycle * 2)) * 0.025 * marker.userData.motion;
    const parts = marker.userData.parts;
    if (parts) {
      const isSleeping = !!pose.sleeping;
      const isSitting = !!pose.sitting || (!!pose.mounted && !isSleeping);
      const isSneaking = !!pose.sneaking && !isSleeping && !isSitting;

      const targetAvatarY = isSleeping ? 0.2 : isSitting ? 0.58 : isSneaking ? -0.08 : 0;
      const targetAvatarTilt = isSleeping ? -Math.PI * 0.5 : 0;
      marker.userData.avatar.position.y += (targetAvatarY - marker.userData.avatar.position.y) * 0.22;
      marker.userData.avatar.rotation.x += (targetAvatarTilt - marker.userData.avatar.rotation.x) * 0.22;

      parts.torso.position.y = 0.75 + headBob;
      parts.torso.position.z = isSitting ? -0.08 : 0;
      parts.torso.rotation.x = isSleeping ? 0 : (isSneaking ? 0.48 : isSitting ? 0.08 : 0);
      parts.headPivot.rotation.x = isSleeping ? 0.08 : (isSneaking ? -0.28 : isSitting ? -0.04 : 0);
      parts.rightArmPivot.rotation.z = 0;
      parts.leftArmPivot.rotation.z = 0;
      parts.rightLegPivot.rotation.z = 0;
      parts.leftLegPivot.rotation.z = 0;
      parts.rightLegPivot.position.set(-0.125, isSitting ? 0.82 : 0.75, isSitting ? 0.06 : 0);
      parts.leftLegPivot.position.set(0.125, isSitting ? 0.82 : 0.75, isSitting ? 0.06 : 0);
      parts.hat.rotation.copy(parts.head.rotation);

      if (isSleeping) {
        parts.rightArmPivot.rotation.x = 0.08;
        parts.leftArmPivot.rotation.x = -0.08;
        parts.rightLegPivot.rotation.x = 0.02;
        parts.leftLegPivot.rotation.x = -0.02;
      } else if (isSitting) {
        parts.rightArmPivot.rotation.x = 0.22 + swing * 0.08;
        parts.leftArmPivot.rotation.x = 0.22 - swing * 0.08;
        parts.rightLegPivot.rotation.x = -1.28;
        parts.leftLegPivot.rotation.x = -1.28;
        parts.rightLegPivot.rotation.z = 0.14;
        parts.leftLegPivot.rotation.z = -0.14;
      } else {
        const armOffset = isSneaking ? 0.25 : 0;
        const legOffset = isSneaking ? -0.12 : 0;
        parts.rightArmPivot.rotation.x = swing + armOffset;
        parts.leftArmPivot.rotation.x = -swing + armOffset;
        parts.rightLegPivot.rotation.x = -swing + legOffset;
        parts.leftLegPivot.rotation.x = swing + legOffset;
      }

      marker.userData.label.position.y = isSleeping ? 1.5 : isSitting ? 2.15 : isSneaking ? 2.3 : 2.6;
    }
    marker.userData.lastNetworkStep *= 0.88;
  }
}

// -----------------------------------------------------------------------
// Animation loop
// -----------------------------------------------------------------------
function animate(now = 0) {
  requestAnimationFrame(animate);
  const deltaSeconds = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
  lastFrameTime = now;
  controls.update();
  processRegionBuildQueue();
  updateRegionVisibility(false);
  updateDayNight(now);
  updatePlayersVisuals(deltaSeconds);
  updateChunkEffects(now);

  if (now >= lastCoordsUpdate) {
    const target = controls.target;
    const nextCoordsText = 'Looking at: ' +
      Math.round(target.x) + ', ' +
      Math.round(target.y) + ', ' +
      Math.round(target.z);
    if (nextCoordsText !== lastCoordsText) {
      coordsEl.textContent = nextCoordsText;
      lastCoordsText = nextCoordsText;
    }
    lastCoordsUpdate = now + 100;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// -----------------------------------------------------------------------
// Init
// -----------------------------------------------------------------------
animate();
loadMapData();
loadWorldState();
loadPlayers();
loadChunkUpdates();
setInterval(loadPlayers, 250);
setInterval(loadWorldState, 250);
setInterval(loadChunkUpdates, 250);
setInterval(refreshMapData, 60000);
</script>
