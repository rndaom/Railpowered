name: DiscordBridge
description: Relays Minecraft chat to Discord and Discord chat into Minecraft
main: com.betaserver.discordbridge.DiscordBridgePlugin
version: ${project.version}
authors:
  - BetaServer
commands:
  dchat:
    description: Internal bridge command for posting Discord messages to chat
    usage: /dchat <author-b64> <message-b64>
